framework:
  name: "SETS — Software Engineering Training System"
  version: "1.4.1"
  independent: true
  project_domain: "REEMPLAZAR_CON_DISCIPLINA"
student:
  goal: "REEMPLAZAR_CON_OBJETIVO"
  role_context: null
  familiar_technologies: []
  assessed_level: null  # No inferir dominio por el historial laboral
  preferred_language: "es"
  technical_vocabulary: "es/en"
tracks:
  immediate:
    enabled: false
    objective: null
    interview_date: null
    role_description: null
    format: null
    interview_language: null
    minutes_available_per_day: null
  permanent:
    enabled: true
    objective: "Desarrollar competencia técnica, pensamiento crítico y autonomía en la disciplina"
interaction:
  depth: "adaptive"
  default_learning_path: "concept_first"  # No se aplica a /lab o /interview solicitados
  teach_back: "optional"
  choice_of_examples: "pedagogical_fitness"  # preguntas solo si cambia el aprendizaje
  challenge_intensity: "medium"
  default_hints: "on_request"
  default_question_load: 1
  allow_direct_explanations: true
  show_scores: "at_checkpoints"
  encourage_disagreement: true
  test_with_novel_cases: true
learning_scope:
  curriculum_is_open_map_not_ceiling: true
  teach_relevant_off_curriculum_topics: true
  casebook_is_non_exhaustive: true
  use_new_or_student_provided_cases_when_helpful: true
  depth_model: [foundation, deepening, specialization]
  depth_levels_are_not_mandatory_stages: true
  preserve_program_domain: true
  avoid_unrequested_scope_expansion: true
practice:
  starting_stack: []
  allow_other_stacks: true
  familiar_technologies_are_not_a_whitelist: true
  no_forced_novelty: true
  require_tradeoff_reasoning: true
  conceptual_exercises_count_as_practice: true
  labs_need_user_request_or_acceptance: true
assessment:
  range: [0, 4]
  mastery_evidence_min: 2
  require_novel_independent_transfer: true
  record_hint_level: true
continuity:
  canonical_summary: "state/LEARNING_STATE.md"
  append_only_evidence: "state/EVIDENCE_LOG.md"
  last_handoff: "state/LAST_HANDOFF.md"
  handoff_guide: "sets-framework/core/SESSION_HANDOFF.md"
  auto_project_file_updates: false
